Resources:
  GithubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: 
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
      Tags:
        - Key: Name
          Value: GitHubOIDCProvider
  GitHubOIDCRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubOIDCRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GithubOidc
            Condition:  
              StringLike:
                token.actions.githubusercontent.com:sub: 
                    - 'repo:viswaanand89@32100328/*:*'
              StringEquals:
                token.actions.githubusercontent.com:aud: 
                    - "sts.amazonaws.com"
            Action: sts:AssumeRoleWithWebIdentity
      policies:
        - PolicyName: GitHubOIDCRolePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource: 
                  - !Sub "arn:aws:s3:::bootstrapbucketnested"
                  - !Sub "arn:aws:s3:::bootstrapbucketnested/*"
                  - !Sub "arn:aws:s3:::resourcetemplatecfn"
                  - !Sub "arn:aws:s3:::resourcetemplatecfn/*"
  bootstrapbucketnested:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: 'bootstrapbucketnested'
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      BucketEncryption: 
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'AES256'
  resourcetemplatecfn:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: 'resourcetemplatecfn'
      BucketEncryption: 
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'AES256'

Outputs:
  GitHubOIDCRoleArn:
    Description: "ARN of the GitHub OIDC Role"
    Value: !GetAtt GitHubOIDCRole.Arn