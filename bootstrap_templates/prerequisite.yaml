Parameters:
  GitHubOrg:
    Type: String
  RepositoryName:
    Type: String
  OIDCProviderArn:
    Description: Arn for the GitHub OIDC Provider.
    Default: ""
    Type: String

Conditions:
  CreateOIDCProvider: !Equals 
    - !Ref OIDCProviderArn
    - ""

Resources:
  GithubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: 
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
      Tags:
        - Key: Name
          Value: !Sub ${GitHubOrg}-${RepositoryName}-oidc-provider
  bootstrapbucketnested:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: 'bootstrapbucketnested'
        NotificationConfiguration:
          EventBridgeConfiguration:
            EventBridgeEnabled: true
        BucketEncryption: 
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: 'AES256'
  resourcetemplatecfn:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: 'resourcetemplatecfn'
        BucketEncryption: 
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: 'AES256'
